name: Publish to npm + GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  # contents: write is required to create the GitHub Release for the tag
  # (gh release create); provenance signing still needs id-token: write.
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so scripts/release-notes.sh can diff from the
          # previous tag (git describe / git log need all tags + commits).
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Verify version matches the tag
        run: |
          TAG="${{ github.ref_name }}"
          VER="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG does not match package version $VER"
            exit 1
          fi
      - name: Verify tag commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag ${{ github.ref_name }} points to a commit not on main; merge the code first, then re-tag on main"
            exit 1
          fi
      # Trusted publishing (OIDC) — no long-lived NODE_AUTH_TOKEN required;
      # npm >= 11.5.1 exchanges the Actions OIDC token for a short-lived
      # publish credential and attaches provenance automatically.
      - name: Publish to npm
        run: npm publish --provenance --access public
      # Create the GitHub Release for the tag after a successful npm publish,
      # so a failed publish never leaves an orphaned release. Notes are
      # generated by scripts/release-notes.sh, which categorizes commits by
      # conventional-commit prefix (feat/fix/refactor/docs/...) — unlike
      # gh --generate-notes, this does not depend on PR labels.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -n "$PREV" ]]; then
            RANGE_ARGS=("$PREV" "$GITHUB_SHA")
          else
            # First release: no previous tag to diff against.
            RANGE_ARGS=("$(git rev-list --max-parents=0 HEAD | tail -1)" "$GITHUB_SHA")
          fi
          ./scripts/release-notes.sh "${RANGE_ARGS[@]}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file release-notes.md
